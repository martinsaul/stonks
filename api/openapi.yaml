openapi: 3.1.0
info:
  title: Stonks API
  version: "1"
  description: |
    Stock-market game API. Prices are integer cents. Every operation except sign-in and
    /healthz requires STONKS-V1 request signing; see docs/API.md.
servers:
  - url: http://localhost:8080
security:
  - stonksSignature: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "200": { description: OK }
  /api/v1/auth/otp/request:
    post:
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OtpRequest" } } }
      responses:
        "202": { description: Code sent, content: { application/json: { schema: { $ref: "#/components/schemas/OtpRequested" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/otp/verify:
    post:
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OtpVerify" } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/LoginResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      responses:
        "200": { description: Account, content: { application/json: { schema: { $ref: "#/components/schemas/MeResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/market:
    get:
      responses:
        "200": { description: Market summary, content: { application/json: { schema: { $ref: "#/components/schemas/MarketResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/quotes/{ticker}:
    get:
      parameters:
        - { name: ticker, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Quote detail, content: { application/json: { schema: { $ref: "#/components/schemas/QuoteResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/quotes/{ticker}/candles:
    get:
      parameters:
        - { name: ticker, in: path, required: true, schema: { type: string } }
        - { name: res, in: query, schema: { type: string, enum: ["5s", "1m", "1d"], default: "1d" } }
        - { name: from, in: query, description: ISO-8601 or epoch ms, schema: { type: string } }
        - { name: to, in: query, description: ISO-8601 or epoch ms, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        "200": { description: Candles, content: { application/json: { schema: { $ref: "#/components/schemas/CandlesResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/news:
    get:
      summary: News, newest first. With a ticker, also market-wide and same-sector news.
      parameters:
        - { name: ticker, in: query, schema: { type: string } }
        - { name: before, in: query, description: Only items with a smaller id (paging back), schema: { type: integer, format: int64 } }
        - { name: after, in: query, description: Only items with a larger id (catching up), schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200": { description: News, content: { application/json: { schema: { $ref: "#/components/schemas/NewsResponse" } } } }
  /api/v1/calendar:
    get:
      summary: Upcoming earnings, dividends, splits, deal closes, IPOs and rate decisions (next 60 game days)
      responses:
        "200": { description: Calendar, content: { application/json: { schema: { $ref: "#/components/schemas/CalendarResponse" } } } }
  /api/v1/economy/{action}:
    post:
      summary: Economy actions (claim, reset, bankrupt, upgrade, clear-badge, buy-bond)
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [claim, reset, bankrupt, upgrade, clear-badge, buy-bond] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                offeringId: { type: integer, format: int64, description: buy-bond only }
                amount: { type: integer, format: int64, description: buy-bond only, cents }
      responses:
        "200": { description: Done, content: { application/json: { schema: { $ref: "#/components/schemas/EconomyResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/bonds:
    get:
      responses:
        "200": { description: Current bond offerings, content: { application/json: { schema: { $ref: "#/components/schemas/BondsResponse" } } } }
  /api/v1/me/name:
    post:
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [displayName], properties: { displayName: { type: string } } } } }
      responses:
        "200": { description: Renamed }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/leaderboards/millionaires:
    get:
      responses:
        "200": { description: Reviewed millionaires, content: { application/json: { schema: { $ref: "#/components/schemas/MillionairesResponse" } } } }
  /api/v1/leaderboards/season:
    get:
      parameters:
        - { name: season, in: query, description: "YYYY-MM (default: current)", schema: { type: string } }
      responses:
        "200": { description: Season standings, content: { application/json: { schema: { $ref: "#/components/schemas/SeasonResponse" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/players/{name}:
    get:
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Public profile, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerProfile" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/portfolio:
    get:
      summary: The player's portfolio (opens the trading account with starting cash on first use)
      responses:
        "200": { description: Portfolio, content: { application/json: { schema: { $ref: "#/components/schemas/Portfolio" } } } }
  /api/v1/orders:
    get:
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, all], default: open } }
      responses:
        "200": { description: Orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Order" } } } } }
    post:
      summary: Place an order (queued; executes at a future tick)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaceOrderRequest" } } }
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/PlaceOrderResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/orders/{id}:
    delete:
      summary: Cancel an open order (or a whole order group)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/fills:
    get:
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Fills, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Fill" } } } } }
  /api/v1/ws:
    get:
      summary: WebSocket price feed (signed via query parameters; see docs/API.md)
      security: []
      parameters:
        - { name: session, in: query, required: true, schema: { type: string } }
        - { name: ts, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: nonce, in: query, required: true, schema: { type: string } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    stonksSignature:
      type: apiKey
      in: header
      name: X-Stonks-Signature
      description: |
        STONKS-V1: X-Stonks-Session, X-Stonks-Timestamp, X-Stonks-Nonce and X-Stonks-Signature
        (ECDSA P-256 over the canonical request). See docs/API.md.
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
  schemas:
    ErrorBody:
      type: object
      required: [error, message]
      properties: { error: { type: string }, message: { type: string } }
    OtpRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    OtpRequested:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId: { type: string, description: Pass to /otp/verify. Known only to the requester. }
        expiresAt: { type: string, format: date-time }
        devCode: { type: string, description: Only in dev mode or while a fixed code is configured }
    OtpVerify:
      type: object
      required: [challengeId, code, publicKey]
      properties:
        challengeId: { type: string }
        code: { type: string, pattern: "^[0-9]{6}$" }
        publicKey: { type: string, description: base64url SPKI DER ECDSA P-256 public key }
    LoginResponse:
      type: object
      required: [sessionId, accountId, expiresAt, serverTime]
      properties:
        sessionId: { type: string }
        accountId: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
        serverTime: { type: integer, format: int64 }
    Badge:
      type: object
      required: [badge, title, description, count, lastAwardedAt]
      properties:
        badge: { type: string }
        title: { type: string }
        description: { type: string }
        count: { type: integer }
        lastAwardedAt: { type: string, format: date-time }
    MeResponse:
      type: object
      required: [accountId, email, createdAt, badges, displayName]
      properties:
        displayName: { type: string, description: Public name (emails are never shown to others) }
        accountId: { type: integer, format: int64 }
        email: { type: string }
        createdAt: { type: string, format: date-time }
        badges: { type: array, items: { $ref: "#/components/schemas/Badge" } }
    SessionInfo:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [OPEN, CLOSED] }
        kind: { type: [string, "null"], enum: [WEEKDAY_A, WEEKDAY_B, WEEKEND, null] }
        opensAt: { type: [string, "null"], format: date-time }
        closesAt: { type: [string, "null"], format: date-time }
        nextOpen: { type: [string, "null"], format: date-time }
        nextKind: { type: [string, "null"] }
    Quote:
      type: object
      required: [ticker, name, sector, last, volume, marketCap]
      properties:
        ticker: { type: string }
        name: { type: string }
        sector: { type: string }
        last: { type: integer, format: int64 }
        bid: { type: [integer, "null"], format: int64 }
        ask: { type: [integer, "null"], format: int64 }
        bidSize: { type: [integer, "null"], format: int64 }
        askSize: { type: [integer, "null"], format: int64 }
        prevClose: { type: [integer, "null"], format: int64 }
        open: { type: [integer, "null"], format: int64 }
        high: { type: [integer, "null"], format: int64 }
        low: { type: [integer, "null"], format: int64 }
        volume: { type: integer, format: int64 }
        change: { type: [integer, "null"], format: int64 }
        changePct: { type: [number, "null"] }
        marketCap: { type: integer, format: int64, description: Dollars }
    IndexQuote:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: number }
        prevClose: { type: [number, "null"] }
        change: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
    DepthLevel:
      type: object
      required: [price, size]
      properties: { price: { type: integer, format: int64 }, size: { type: integer, format: int64 } }
    Depth:
      type: object
      required: [bids, asks]
      properties:
        bids: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
        asks: { type: array, items: { $ref: "#/components/schemas/DepthLevel" } }
    Candle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: string, format: date-time }
        open: { type: integer, format: int64 }
        high: { type: integer, format: int64 }
        low: { type: integer, format: int64 }
        close: { type: integer, format: int64 }
        volume: { type: integer, format: int64 }
    LegRequest:
      type: object
      required: [side, quantity, type]
      properties:
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, format: int64, minimum: 1 }
        type: { type: string, enum: [MARKET, LIMIT, STOP, STOP_LIMIT, TRAILING_STOP, TRAILING_STOP_LIMIT, TWAP, VWAP] }
        limitPrice: { type: [integer, "null"], format: int64 }
        stopPrice: { type: [integer, "null"], format: int64 }
        trailAmount: { type: [integer, "null"], format: int64 }
        trailPercent: { type: [number, "null"] }
        limitOffset: { type: [integer, "null"], format: int64 }
        timeInForce: { type: string, enum: [DAY, GTC, IOC], default: DAY }
        durationMinutes: { type: [integer, "null"], description: TWAP/VWAP execution window }
    PlaceOrderRequest:
      type: object
      required: [ticker, legs]
      properties:
        ticker: { type: string }
        structure: { type: string, enum: [SINGLE, OCO, OTO, BRACKET], default: SINGLE }
        legs: { type: array, items: { $ref: "#/components/schemas/LegRequest" } }
    PlaceOrderResponse:
      type: object
      required: [groupId, orderIds, status]
      properties:
        groupId: { type: integer, format: int64 }
        orderIds: { type: array, items: { type: integer, format: int64 } }
        status: { type: string }
        executesAt: { type: [string, "null"], format: date-time }
    Order:
      type: object
      required: [id, groupId, ticker, side, type, quantity, filled, status, liquidation, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        ticker: { type: string }
        side: { type: string }
        type: { type: string }
        quantity: { type: integer, format: int64 }
        filled: { type: integer, format: int64 }
        avgPrice: { type: [number, "null"] }
        limitPrice: { type: [integer, "null"], format: int64 }
        stopPrice: { type: [integer, "null"], format: int64 }
        status: { type: string, enum: [WAITING, QUEUED, ARMED, WORKING, FILLED, CANCELLED, EXPIRED, REJECTED] }
        reason: { type: [string, "null"] }
        liquidation: { type: boolean }
        updatedAt: { type: string, format: date-time }
    Fill:
      type: object
      required: [id, orderId, ticker, side, quantity, price, commission, realized, maker, liquidation, at]
      properties:
        id: { type: string }
        orderId: { type: integer, format: int64 }
        ticker: { type: string }
        side: { type: string }
        quantity: { type: integer, format: int64 }
        price: { type: integer, format: int64 }
        commission: { type: integer, format: int64 }
        realized: { type: integer, format: int64 }
        maker: { type: boolean }
        liquidation: { type: boolean }
        at: { type: string, format: date-time }
    Position:
      type: object
      required: [ticker, quantity, avgPrice, last, marketValue, unrealized, unrealizedPct]
      properties:
        ticker: { type: string }
        quantity: { type: integer, format: int64, description: Negative for shorts }
        avgPrice: { type: number, description: Cents }
        last: { type: integer, format: int64 }
        marketValue: { type: integer, format: int64 }
        unrealized: { type: integer, format: int64 }
        unrealizedPct: { type: number }
        dayChange: { type: [integer, "null"], format: int64 }
    Notice:
      type: object
      required: [seq, kind, text, at]
      properties:
        seq: { type: integer, format: int64 }
        kind: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
    Portfolio:
      type: object
      required: [accountId, plan, cash, equity, longValue, shortValue, availableEquity, buyingPower, marginDebt, maintenanceRequirement, initialMargin, maintenanceMargin, lifetimeRealized, commissionsPaid, interestPaid, positions, openOrders, notices, standing]
      properties:
        accountId: { type: integer, format: int64 }
        plan: { type: string, enum: [ROOKIE, TRADER, PRO, WHALE] }
        cash: { type: integer, format: int64, description: Negative = margin loan }
        equity: { type: integer, format: int64 }
        longValue: { type: integer, format: int64 }
        shortValue: { type: integer, format: int64 }
        availableEquity: { type: integer, format: int64 }
        buyingPower: { type: integer, format: int64 }
        marginDebt: { type: integer, format: int64 }
        maintenanceRequirement: { type: integer, format: int64 }
        initialMargin: { type: number }
        maintenanceMargin: { type: number }
        lifetimeRealized: { type: integer, format: int64 }
        commissionsPaid: { type: integer, format: int64 }
        interestPaid: { type: integer, format: int64 }
        positions: { type: array, items: { $ref: "#/components/schemas/Position" } }
        openOrders: { type: array, items: { $ref: "#/components/schemas/Order" } }
        notices: { type: array, items: { $ref: "#/components/schemas/Notice" } }
        standing: { $ref: "#/components/schemas/Standing" }
    Bond:
      type: object
      required: [offeringId, name, principal, payout, maturityDay, maturesAt]
      properties:
        offeringId: { type: integer, format: int64 }
        name: { type: string }
        principal: { type: integer, format: int64 }
        payout: { type: integer, format: int64 }
        maturityDay: { type: integer }
        maturesAt: { type: [string, "null"], format: date-time }
    Standing:
      type: object
      description: Economy standing. Everything except bonds survives resets.
      required: [netWorth, startingCash, cashLevel, nextUpgradeCost, shame, shameEver, eternalShame, clearCost, bankruptcies, claimEligible, nextClaimAt, nextResetAt, gameOverAt, runStartCash, bonds]
      properties:
        netWorth: { type: integer, format: int64, description: Equity plus bonds at face value }
        startingCash: { type: integer, format: int64 }
        cashLevel: { type: integer }
        nextUpgradeCost: { type: [integer, "null"], format: int64 }
        shame: { type: integer, description: Outstanding badges of shame }
        shameEver: { type: integer }
        eternalShame: { type: boolean }
        clearCost: { type: [integer, "null"], format: int64 }
        bankruptcies: { type: integer }
        claimEligible: { type: boolean, description: Net worth below $1k }
        nextClaimAt: { type: [string, "null"], format: date-time }
        nextResetAt: { type: [string, "null"], format: date-time }
        gameOverAt: { type: integer, format: int64, description: Forced bankruptcy at or below this net worth }
        runStartCash: { type: integer, format: int64 }
        bonds: { type: array, items: { $ref: "#/components/schemas/Bond" } }
    EconomyResult:
      type: object
      required: [ok, standing]
      properties:
        ok: { type: boolean }
        standing: { oneOf: [{ $ref: "#/components/schemas/Standing" }, { type: "null" }] }
    BondOffering:
      type: object
      required: [id, name, returnPct, capPerPlayer, open, closesAt, maturesAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        returnPct: { type: number }
        capPerPlayer: { type: integer, format: int64 }
        open: { type: boolean }
        closesAt: { type: [string, "null"], format: date-time }
        maturesAt: { type: [string, "null"], format: date-time }
    BondsResponse:
      type: object
      required: [offerings]
      properties:
        offerings: { type: array, items: { $ref: "#/components/schemas/BondOffering" } }
    Millionaire:
      type: object
      required: [rank, name, netWorth, shame, eternalShame, plan]
      properties:
        rank: { type: integer }
        name: { type: string }
        netWorth: { type: integer, format: int64 }
        shame: { type: integer }
        eternalShame: { type: boolean }
        plan: { type: string }
    MillionairesResponse:
      type: object
      required: [entries, yourStatus, pendingReviews]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/Millionaire" } }
        yourStatus: { type: [string, "null"], enum: [PENDING, APPROVED, REJECTED, null] }
        pendingReviews: { type: integer }
    SeasonEntry:
      type: object
      required: [rank, name, returnPct, netWorth, trades, activeDays, unranked]
      properties:
        rank: { type: [integer, "null"] }
        name: { type: string }
        returnPct: { type: [number, "null"] }
        netWorth: { type: [integer, "null"], format: int64 }
        trades: { type: integer }
        activeDays: { type: integer }
        unranked: { type: [string, "null"], description: Why the entry isn't ranked }
    SeasonResponse:
      type: object
      required: [season, startsAt, endsAt, finalized, minTrades, minActiveDays, entries, you, seasons]
      properties:
        season: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        finalized: { type: boolean }
        minTrades: { type: integer }
        minActiveDays: { type: integer }
        entries: { type: array, items: { $ref: "#/components/schemas/SeasonEntry" } }
        you: { oneOf: [{ $ref: "#/components/schemas/SeasonEntry" }, { type: "null" }] }
        seasons: { type: array, items: { type: string } }
    PlayerProfile:
      type: object
      required: [name, joined, plan, netWorth, cashLevel, shame, eternalShame, bankruptcies, badges, seasons]
      properties:
        name: { type: string }
        joined: { type: string, format: date-time }
        plan: { type: [string, "null"] }
        netWorth: { type: [integer, "null"], format: int64 }
        cashLevel: { type: integer }
        shame: { type: integer }
        eternalShame: { type: boolean }
        bankruptcies: { type: integer }
        badges:
          type: array
          items:
            type: object
            required: [badge, title, description, count]
            properties: { badge: { type: string }, title: { type: string }, description: { type: string }, count: { type: integer } }
        seasons:
          type: array
          items:
            type: object
            required: [season, rank, returnPct]
            properties: { season: { type: string }, rank: { type: [integer, "null"] }, returnPct: { type: [number, "null"] } }
    NewsItem:
      type: object
      required: [id, time, day, ticker, sector, category, headline, tone]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        day: { type: integer, description: Game day }
        ticker: { type: [string, "null"], description: Null for market-wide or sector news }
        sector: { type: [string, "null"] }
        category: { type: string, enum: [EARNINGS, DIVIDEND, CORPORATE, REGULATORY, LEGAL, ANALYST, RUMOR, SECTOR, MACRO, DEAL, LISTING, SPLIT, DISTRESS] }
        headline: { type: string }
        tone: { type: string, enum: [positive, negative, neutral] }
    NewsResponse:
      type: object
      required: [news]
      properties:
        news: { type: array, items: { $ref: "#/components/schemas/NewsItem" } }
    CalendarEvent:
      type: object
      required: [date, day, kind, ticker, name, detail]
      properties:
        date: { type: string, format: date-time, description: Session open }
        day: { type: integer }
        kind: { type: string, enum: [EARNINGS, EX_DIVIDEND, DIVIDEND_PAY, SPLIT, DEAL_CLOSE, IPO, RATE_DECISION] }
        ticker: { type: [string, "null"] }
        name: { type: [string, "null"] }
        detail: { type: string }
    Delisting:
      type: object
      required: [ticker, name, day, price, reason]
      properties:
        ticker: { type: string }
        name: { type: string }
        day: { type: integer }
        price: { type: integer, format: int64, description: Settlement price (0 = bankruptcy) }
        reason: { type: string }
    CalendarResponse:
      type: object
      required: [benchmarkRate, events, delistings]
      properties:
        benchmarkRate: { type: number, description: Percent }
        events: { type: array, items: { $ref: "#/components/schemas/CalendarEvent" } }
        delistings: { type: array, items: { $ref: "#/components/schemas/Delisting" } }
    Fundamentals:
      type: object
      required: [shares, epsTtm, pe, dividend, dividendYield, exDividendDate, dividendPayDate, nextEarnings, consensusEps, status, dealOffer, splitDate, splitRatio, shortInterest, shortInterestPct, borrowFee]
      properties:
        shares: { type: integer, format: int64 }
        epsTtm: { type: [integer, "null"], format: int64 }
        pe: { type: [number, "null"] }
        dividend: { type: integer, format: int64, description: Quarterly, per share }
        dividendYield: { type: [number, "null"], description: Annual, percent }
        exDividendDate: { type: [string, "null"], format: date-time }
        dividendPayDate: { type: [string, "null"], format: date-time }
        nextEarnings: { type: [string, "null"], format: date-time }
        consensusEps: { type: integer, format: int64 }
        status: { type: string, enum: [ACTIVE, DISTRESS, DEAL_PENDING] }
        dealOffer: { type: [integer, "null"], format: int64 }
        splitDate: { type: [string, "null"], format: date-time }
        splitRatio: { type: [number, "null"], description: New shares per old share }
        shortInterest: { type: integer, format: int64 }
        shortInterestPct: { type: number }
        borrowFee: { type: number, description: Annual, percent }
    MarketResponse:
      type: object
      required: [time, session, regime, index, quotes, benchmarkRate, latestNewsId]
      properties:
        benchmarkRate: { type: number, description: Central bank rate, percent }
        latestNewsId: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        session: { $ref: "#/components/schemas/SessionInfo" }
        regime: { type: string, enum: [NEUTRAL, BULL, BEAR, CRASH, BUBBLE] }
        index: { $ref: "#/components/schemas/IndexQuote" }
        quotes: { type: array, items: { $ref: "#/components/schemas/Quote" } }
    QuoteResponse:
      type: object
      required: [time, session, quote, profile, stats, depth, fundamentals]
      properties:
        time: { type: string, format: date-time }
        session: { $ref: "#/components/schemas/SessionInfo" }
        quote: { $ref: "#/components/schemas/Quote" }
        profile:
          type: object
          required: [ticker, name, sector, sharesOutstanding]
          properties:
            ticker: { type: string }
            name: { type: string }
            sector: { type: string }
            sharesOutstanding: { type: integer, format: int64 }
        stats:
          type: object
          properties:
            high52w: { type: [integer, "null"], format: int64 }
            low52w: { type: [integer, "null"], format: int64 }
            avgVolume30d: { type: [integer, "null"], format: int64 }
        depth: { $ref: "#/components/schemas/Depth" }
        fundamentals: { $ref: "#/components/schemas/Fundamentals" }
    CandlesResponse:
      type: object
      required: [ticker, resolution, candles]
      properties:
        ticker: { type: string }
        resolution: { type: string }
        candles: { type: array, items: { $ref: "#/components/schemas/Candle" } }
        live: { oneOf: [{ $ref: "#/components/schemas/Candle" }, { type: "null" }] }
